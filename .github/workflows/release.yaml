name: release

on:
  workflow_call:

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load workflow environment
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r line || [[ -n "$line" ]]; do
            line="${line%$'\r'}"
            [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue

            if [[ ! "$line" =~ ^[A-Za-z_][A-Za-z0-9_]*=.*$ ]]; then
              echo "::error file=.github/workflows/env::Invalid environment assignment"
              exit 1
            fi

            printf '%s\n' "$line" >> "$GITHUB_ENV"
          done < .github/workflows/env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.V_CONTAINER_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release image manifest
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          COMPONENTS=(
            cloudman
            collector
            dirsync
            secretman
            genesis
            nocturne
            rscserver
            apiserver
            clusterman
            console
            publicserver
            logstore
            rscstore
            metricstore
            policyportal
            accessportal
          )

          mkdir -p release-files
          IMAGES='[]'

          for component in "${COMPONENTS[@]}"; do
            image="${V_CONTAINER_REGISTRY}/${V_ORG}/octeliumee-${component}"
            tag="${image}:${VERSION}"

            manifest_json="$(
              docker buildx imagetools inspect \
                "$tag" \
                --format '{{json .Manifest}}'
            )"
            digest="$(jq -er '.digest | select(type == "string" and startswith("sha256:"))' <<< "$manifest_json")"

            echo "${tag} -> ${digest}"
            IMAGES="$(
              jq -c \
                --arg component "$component" \
                --arg image "$image" \
                --arg tag "$tag" \
                --arg digest "$digest" \
                '. + [{component: $component, image: $image, tag: $tag, digest: $digest, reference: ($image + "@" + $digest)}]' \
                <<< "$IMAGES"
            )"
          done

          jq -n \
            --arg schema_version "1" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg ref "${GITHUB_REF}" \
            --arg commit "${GITHUB_SHA}" \
            --arg version "$VERSION" \
            --arg generated_at "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            --argjson images "$IMAGES" \
            '{
              schemaVersion: $schema_version,
              repository: $repository,
              ref: $ref,
              commit: $commit,
              version: $version,
              generatedAt: $generated_at,
              images: $images
            }' > release-files/release-manifest.json

          jq -e . release-files/release-manifest.json > /dev/null

      - name: Generate repository SBOM
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          API_VERSION="2026-03-10"
          GENERATE_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/dependency-graph/sbom/generate-report"

          response="$(
            curl --fail --show-error --silent \
              --retry 3 \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: ${API_VERSION}" \
              "$GENERATE_URL"
          )"

          sbom_url="$(jq -er '.sbom_url' <<< "$response")"
          tmp_file="$(mktemp)"
          trap 'rm -f "$tmp_file"' EXIT

          for attempt in $(seq 1 60); do
            status="$(
              curl --show-error --silent --location \
                --retry 3 \
                --output "$tmp_file" \
                --write-out '%{http_code}' \
                -H 'Accept: application/vnd.github+json' \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: ${API_VERSION}" \
                "$sbom_url"
            )"

            case "$status" in
              200)
                mv "$tmp_file" release-files/sbom.spdx.json
                trap - EXIT
                jq -e '.spdxVersion and .SPDXID' release-files/sbom.spdx.json > /dev/null
                exit 0
                ;;
              202)
                echo "SBOM is still being generated (attempt ${attempt}/60)"
                sleep 5
                ;;
              *)
                echo "::error::Unexpected HTTP status while fetching SBOM: ${status}"
                cat "$tmp_file" || true
                exit 1
                ;;
            esac
          done

          echo "::error::Timed out waiting for GitHub to generate the SBOM"
          exit 1

      - name: Generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-files
          sha256sum release-manifest.json sbom.spdx.json > SHA256SUMS
          sha256sum --check --strict SHA256SUMS

      - name: Generate release provenance attestation
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release-files/SHA256SUMS

      - name: Add attestation bundle to release assets
        shell: bash
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp -- "$ATTESTATION_BUNDLE" release-files/release-attestation.json
          jq -e . release-files/release-attestation.json > /dev/null

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail

          test -s release-files/release-manifest.json
          test -s release-files/sbom.spdx.json
          test -s release-files/SHA256SUMS
          test -s release-files/release-attestation.json

          echo "=== Release assets ==="
          ls -lh release-files/

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release-files/*
          fail_on_unmatched_files: true
          generate_release_notes: true

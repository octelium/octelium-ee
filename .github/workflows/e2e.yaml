name: tests-e2e
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "The e2e scenario to run against"
        required: false
        default: "k3s-flannel-ee-full"
      spiffe:
        description: "Install SPIRE and enable the SPIFFE CSI driver (always enabled for full and spire scenarios, ignored by multi-region)"
        required: false
        type: boolean
        default: false
      run:
        description: "Only run tests matching this regular expression (go test -run)"
        required: false
        default: ""
      suite:
        description: "Which phases to run. multi-region runs the k3s-flannel-ee-multi-region scenario, which joins a second k3s cluster as a Region, instead of the scenario input"
        required: false
        type: choice
        options:
          - enterprise
          - all
          - multi-region
        default: enterprise
      packageVersion:
        description: "octeliumee package version to install. Defaults to this branch"
        required: false
        default: ""
      coreVersion:
        description: "Octelium core version to install. Empty means latest"
        required: false
        default: "main"
      skipApply:
        description: "With suite=all, skip the core Apply phase and its database upstreams"
        required: false
        type: boolean
        default: false
env:
  GO_VERSION: "1.27.3"
  OCTELIUM_EE_E2E_SUITE: ${{ inputs.suite || 'enterprise' }}
  OCTELIUM_E2E_PACKAGE_VERSION: ${{ inputs.packageVersion }}
  OCTELIUM_E2E_CORE_VERSION: ${{ inputs.coreVersion }}
  OCTELIUM_E2E_SKIP_APPLY: ${{ inputs.skipApply }}
  OCTELIUM_E2E_SPIFFE: ${{ inputs.spiffe }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            scenario: k3s-flannel-ee-full
          - runner: ubuntu-24.04-arm
            scenario: k3s-flannel-ee-full
    runs-on: ${{ matrix.runner }}
    name: ${{ inputs.suite == 'multi-region' && 'k3s-flannel-ee-multi-region' || matrix.scenario }}-${{ matrix.runner }}
    timeout-minutes: 180
    env:
      E2E_SCENARIO: ${{ inputs.suite == 'multi-region' && 'k3s-flannel-ee-multi-region' || inputs.scenario || matrix.scenario }}
      E2E_TIMEOUT: ${{ inputs.suite == 'multi-region' && '150m' || '90m' }}
    steps:
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install --yes libssl-dev

      - name: Reclaim disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          docker system prune --all --force || true
          df -h /

      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Set up go
        uses: actions/setup-go@v5
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache-dependency-path: "**/go.sum"

      - name: Build
        run: |
          go version
          make build-e2e
          make install-cli

      - name: Provision
        run: ./bin/octeliumee-e2e provision --scenario=${{ env.E2E_SCENARIO }}

      - name: Prepare
        run: ./bin/octeliumee-e2e prepare --scenario=${{ env.E2E_SCENARIO }}

      - name: Install
        run: ./bin/octeliumee-e2e install --scenario=${{ env.E2E_SCENARIO }}

      - name: Test
        env:
          GOFLAGS: "-failfast"
        run: |
          set -o pipefail
          OUT="${{ runner.temp }}/e2e-artifacts"
          mkdir -p "$OUT"
          ./bin/octeliumee-e2e test \
            --scenario=${{ env.E2E_SCENARIO }} \
            --artifacts="$OUT" \
            --timeout=${{ env.E2E_TIMEOUT }} \
            ${{ inputs.run && format('--run={0}', inputs.run) || '' }} \
            2>&1 | tee "$OUT/test.log"

      - name: Collect cluster state on failure
        if: failure()
        run: |
          OUT="${{ runner.temp }}/e2e-artifacts"
          mkdir -p "$OUT"

          kubectl get all -A -o wide > "$OUT/get-all.txt" 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp > "$OUT/events.txt" 2>&1 || true
          kubectl describe nodes > "$OUT/describe-nodes.txt" 2>&1 || true
          { df -h /; echo; free -h; } > "$OUT/host-resources.txt" 2>&1 || true
          kubectl describe pods -n octelium > "$OUT/describe-pods.txt" 2>&1 || true
          kubectl get pods -n octelium \
            -o custom-columns=NAME:.metadata.name,STATUS:.status.phase,IMAGE:.spec.containers[*].image \
            > "$OUT/pod-images.txt" 2>&1 || true
          kubectl get jobs -n octelium -o wide > "$OUT/jobs.txt" 2>&1 || true

          for pod in $(kubectl get pods -n octelium -o name 2>/dev/null); do
            name=$(basename "$pod")
            kubectl logs "$pod" -n octelium --all-containers --tail=200 \
              > "$OUT/logs-${name}.txt" 2>&1 || true
            kubectl logs "$pod" -n octelium --all-containers --tail=200 --previous \
              > "$OUT/logs-${name}-previous.txt" 2>&1 || true
          done
          find "$OUT" -name 'logs-*-previous.txt' -size -1c -delete || true

          if kubectl get namespace spire >/dev/null 2>&1; then
            kubectl get csidriver -o wide > "$OUT/spire-csidrivers.txt" 2>&1 || true
            kubectl get all -n spire -o wide > "$OUT/spire-get-all.txt" 2>&1 || true
            kubectl get configmaps -n spire -o yaml > "$OUT/spire-configmaps.txt" 2>&1 || true
            kubectl describe pods -n spire > "$OUT/spire-describe-pods.txt" 2>&1 || true

            for pod in $(kubectl get pods -n spire -o name 2>/dev/null); do
              kubectl logs "$pod" -n spire --all-containers --tail=200 \
                > "$OUT/spire-logs-$(basename "$pod").txt" 2>&1 || true
            done
          fi

          REGION_KUBECONFIG=/tmp/octelium-e2e/region-1.kubeconfig
          if [ -f "$REGION_KUBECONFIG" ]; then
            kubectl --kubeconfig "$REGION_KUBECONFIG" get all -A -o wide > "$OUT/region-get-all.txt" 2>&1 || true
            kubectl --kubeconfig "$REGION_KUBECONFIG" get events -A --sort-by=.lastTimestamp \
              > "$OUT/region-events.txt" 2>&1 || true
            kubectl --kubeconfig "$REGION_KUBECONFIG" describe nodes > "$OUT/region-describe-nodes.txt" 2>&1 || true
            kubectl --kubeconfig "$REGION_KUBECONFIG" describe pods -n octelium \
              > "$OUT/region-describe-pods.txt" 2>&1 || true
            kubectl --kubeconfig "$REGION_KUBECONFIG" get jobs -n octelium -o wide > "$OUT/region-jobs.txt" 2>&1 || true

            for pod in $(kubectl --kubeconfig "$REGION_KUBECONFIG" get pods -n octelium -o name 2>/dev/null); do
              kubectl --kubeconfig "$REGION_KUBECONFIG" logs "$pod" -n octelium --all-containers --tail=200 \
                > "$OUT/region-logs-$(basename "$pod").txt" 2>&1 || true
            done
          fi

          for c in octelium-e2e-region-1 octelium-e2e-postgres octelium-e2e-redis; do
            if sudo docker inspect "$c" >/dev/null 2>&1; then
              sudo docker logs --tail 500 "$c" > "$OUT/docker-$c.txt" 2>&1 || true
            fi
          done
          { ip route; echo; sudo iptables -t nat -S; echo; sudo iptables -S; } > "$OUT/host-network.txt" 2>&1 || true

          cp /tmp/octelium-e2e-k3s.log "$OUT/" 2>/dev/null || true
        env:
          KUBECONFIG: /etc/rancher/k3s/k3s.yaml

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ env.E2E_SCENARIO }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore
          retention-days: 7

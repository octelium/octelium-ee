name: tests-unit-test
on:
  push:
    tags:
      - v*
    branches:
      - master
      - main
      - dev*
      - t-*
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VAULT_ADDR: http://127.0.0.1:8200
    services:
      postgres:
        image: postgres
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
      redis:
        image: redis
        ports:
          - 6379:6379
      minio:
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
        image: fclairamb/minio-github-actions
        ports:
          - 9000:9000
      vault:
        image: hashicorp/vault
        ports:
          - 8200:8200
        env:
          VAULT_DEV_ROOT_TOKEN_ID: root
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    steps:
      - name: Set up go
        uses: actions/setup-go@v5
        with:
          go-version: "${{env.GO_VERSION}}"
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4
      - name: Install psql
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Set ENV variables
        run: cat .github/workflows/env >> "$GITHUB_ENV"
      - name: Create database
        run: psql -h localhost -U postgres -c 'CREATE DATABASE octelium;'
        env:
          PGPASSWORD: postgres
      - name: Wait for Vault
        run: |
          for i in $(seq 1 60); do
            if curl -sfo /dev/null "${VAULT_ADDR}/v1/sys/health"; then
              echo "Vault is ready at ${VAULT_ADDR}"
              exit 0
            fi
            sleep 1
          done
          echo "Vault did not become ready at ${VAULT_ADDR}" >&2
          exit 1
      - name: Run tests
        run: |
          go version
          which go
          gocmd=$(which go)
          sudo -E $gocmd version
          sudo -E $gocmd test github.com/octelium/octelium-ee/...
